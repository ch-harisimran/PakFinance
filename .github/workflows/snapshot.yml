name: Net worth snapshot

# The one irreplaceable job in the system.
#
# PSX prices can be backfilled from the EOD feed, but bank balances and NAVs
# cannot: we only ever know what they are today. A day this job misses is a day
# missing from every user's net-worth chart, permanently. Hence the daily retry
# an hour after the main run — a single transient failure should not cost a
# data point.
#
# Times are UTC; PKT is UTC+5 with no DST:
#   13:30 UTC = 18:30 PKT  (after the latest PSX close at 16:30, and after the
#                           evening MUFAP NAV publication)
#   14:30 UTC = 19:30 PKT  (retry; the job no-ops if the first run succeeded)
#
# Runs seven days a week. Weekends carry forward Friday's prices, which is
# correct — a portfolio does not stop existing on Saturday, and a gap in the
# series would render as a hole in the chart.
on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite today's row even if it already exists"
        type: boolean
        default: false

concurrency:
  # The upsert makes a double run harmless, but there is nothing to gain from
  # two of them racing on the same rows.
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The lock file is written by npm 11 on the developer's machine, and
      # npm 10 — which Node 22 bundles — refuses to install it: `vite` under
      # `vitest` needs esbuild ^0.27||^0.28 and the hoisted copy is 0.25.12, a
      # tree npm 11 resolves and npm 10 reports as
      # "Missing: esbuild@0.28.2 from lock file". Every scheduled job failed on
      # this. Matching the major here is what stops a lock that installs fine
      # locally from breaking CI; bump it if the local npm major moves.
      - name: Match the npm that wrote the lock file
        run: npm install -g npm@11

      - name: Install
        working-directory: frontend
        # Not --ignore-scripts: esbuild (via tsx) needs its postinstall to place
        # the platform binary, and the job cannot run without it.
        run: npm ci

      - name: Snapshot
        working-directory: frontend
        env:
          # Session pooler (port 5432). The direct db.*.supabase.co host is
          # IPv6-only and unreachable from GitHub runners.
          DATABASE_POOL_URL: ${{ secrets.DATABASE_POOL_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/snapshot.ts ${{ inputs.force && '--force' || '' }}
