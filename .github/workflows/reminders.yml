name: Loan reminders

# Once a day, in the morning Pakistan time.
#
#   03:30 UTC = 08:30 PKT
#
# A reminder about money is worth reading at breakfast and useless at midnight,
# so this runs at a civil hour rather than whenever the scheduler is idle.
#
# Sending is idempotent: the job records every (loan, repayment date) it has
# emailed and refuses to repeat one, so a delayed or duplicated run cannot email
# the same person about the same installment twice.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be sent, send nothing"
        type: boolean
        default: true

concurrency:
  group: loan-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The lock file is written by npm 11 on the developer's machine, and
      # npm 10 — which Node 22 bundles — refuses to install it: `vite` under
      # `vitest` needs esbuild ^0.27||^0.28 and the hoisted copy is 0.25.12, a
      # tree npm 11 resolves and npm 10 reports as
      # "Missing: esbuild@0.28.2 from lock file". Every scheduled job failed on
      # this. Matching the major here is what stops a lock that installs fine
      # locally from breaking CI; bump it if the local npm major moves.
      - name: Match the npm that wrote the lock file
        run: npm install -g npm@11

      - name: Install
        # Not --ignore-scripts: esbuild (via tsx) needs its postinstall to place
        # the platform binary, and the job cannot run without it.
        run: npm ci

      - name: Send reminders
        env:
          # Session pooler (port 5432). The direct db.*.supabase.co host is
          # IPv6-only and unreachable from GitHub runners.
          DATABASE_POOL_URL: ${{ secrets.DATABASE_POOL_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          BREVO_SENDER_NAME: PakFinance
        run: npx tsx scripts/send-reminders.ts ${{ inputs.dry_run && '--dry-run' || '' }}
