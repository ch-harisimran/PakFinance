name: MUFAP NAV sync

# NAVs are published once a day after the close, so unlike PSX there are no
# trading sessions to respect — the only guard is "have we already got today's
# report" (12 hours, in lib/market/sync-nav.ts).
#
# Two runs, because MUFAP does not publish at a fixed time:
#   14:00 UTC = 19:00 PKT   first attempt
#   16:30 UTC = 21:30 PKT   retry, no-ops if the first one succeeded
on:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the 12-hour interval guard"
        type: boolean
        default: false

concurrency:
  group: sync-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Sync NAVs
        working-directory: frontend
        env:
          DATABASE_POOL_URL: ${{ secrets.DATABASE_POOL_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MUFAP_NAV_URL: ${{ secrets.MUFAP_NAV_URL }}
          PSX_USER_AGENT: "PakFinance/0.1 (personal finance tracker; +https://github.com/ch-harisimran/PakFinance)"
        run: npx tsx scripts/sync-nav.ts ${{ inputs.force && '--force' || '' }}
