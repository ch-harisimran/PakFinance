name: MUFAP NAV sync

# SCHEDULE DISABLED — this cannot currently succeed.
#
# MUFAP sits behind a Cloudflare JavaScript challenge. A server-side fetch gets
# the "Just a moment…" interstitial, not the report, and it fails identically
# from a residential connection and from a GitHub runner — so it is not IP
# reputation and not the User-Agent. Passing the challenge would mean defeating
# a deliberate anti-automation measure, which this project does not do.
#
# Until MUFAP offers a feed or allowlists a client, NAVs are ingested from a
# report saved in a browser:
#
#   npm --prefix frontend run sync:nav -- --file
#
# Kept as manual-dispatch only so a scheduled run does not fail nightly. To
# re-enable once access exists, restore:
#   schedule:
#     - cron: "0 14 * * 1-5"
#     - cron: "30 16 * * 1-5"
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the 12-hour interval guard"
        type: boolean
        default: false

concurrency:
  group: sync-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The lock file is written by npm 11 on the developer's machine, and
      # npm 10 — which Node 22 bundles — refuses to install it: `vite` under
      # `vitest` needs esbuild ^0.27||^0.28 and the hoisted copy is 0.25.12, a
      # tree npm 11 resolves and npm 10 reports as
      # "Missing: esbuild@0.28.2 from lock file". Every scheduled job failed on
      # this. Matching the major here is what stops a lock that installs fine
      # locally from breaking CI; bump it if the local npm major moves.
      - name: Match the npm that wrote the lock file
        run: npm install -g npm@11

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Sync NAVs
        working-directory: frontend
        env:
          DATABASE_POOL_URL: ${{ secrets.DATABASE_POOL_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MUFAP_NAV_URL: ${{ secrets.MUFAP_NAV_URL }}
          PSX_USER_AGENT: "PakFinance/0.1 (personal finance tracker; +https://github.com/ch-harisimran/PakFinance)"
        run: npx tsx scripts/sync-nav.ts ${{ inputs.force && '--force' || '' }}
